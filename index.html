<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الرسالة · قراءة اليوم</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/style.css">
<script>
// يوجّه إلى قراءة اليوم حسب التاريخ. اليوم ١ = 2026-08-22.
(function(){
  var START = Date.UTC(2026, 7, 22); // (الشهر 0-based: 7 = أغسطس)
  function go(total){
    var now = new Date();
    var today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    var n = Math.floor((today - START) / 86400000) + 1;
    if (n < 1) n = 1;
    if (n > total) n = total;
    location.replace('days/day-' + String(n).padStart(3,'0') + '.html');
  }
  fetch('manifest.json', {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(m){ go(m.total || 1); })
    .catch(function(){ location.replace('days/day-001.html'); });
})();
</script>
</head>
<body>
<div class="wrap" style="text-align:center;padding-top:4rem">
  <div class="mast" style="border:0">
    <p class="k">مجلة الرسالة</p>
    <h1>الرِّسالة</h1>

  </div>

</div>
