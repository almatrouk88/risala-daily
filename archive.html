<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الرسالة · الأرشيف</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/style.css?v=9">
<link rel="manifest" href="app.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="assets/icon.svg">
</head>
<body>
<button class="tt" id="tt" aria-label="تبديل الوضع">◐</button>
<div class="wrap">
  <nav class="nav">
    <a class="home" href="index.html">📜 الرسالة</a>
    <span style="display:flex;gap:.45rem"><a href="search.html">🔍 بحث</a><a href="marks.html">🔖 علاماتي</a></span>
  </nav>
  <header class="mast">
    <p class="k">مجلة الرسالة</p>
    <h1>الأرشيف</h1>
    <p class="m">رحلة قراءةٍ يوميّة · من العدد الأوّل (١٩٣٣)</p>
  </header>
  <ul class="archive-list" id="list"><li>…جارٍ التحميل</li></ul>
</div>
<script>
fetch('manifest.json', {cache:'no-store'}).then(function(r){return r.json();}).then(function(m){
  var arNum=function(n){return String(n).replace(/[0-9]/g,function(d){return "٠١٢٣٤٥٦٧٨٩"[d]})};
  var ul=document.getElementById('list'); ul.innerHTML='';
  m.days.slice().reverse().forEach(function(d){
    var li=document.createElement('li');
    var a=document.createElement('a');
    a.href='days/day-'+String(d.n).padStart(3,'0')+'.html';
    a.innerHTML='<span class="d">اليوم '+arNum(d.n)+' — '+d.title+'</span><span class="t">'+(d.authors||'')+' · '+d.date+'</span>';
    li.appendChild(a); ul.appendChild(li);
  });
});
</script>
<script src="assets/footnotes.js?v=9"></script>
</body>
</html>
